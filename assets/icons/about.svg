<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glowAbout" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="badgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="infoGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilterAbout" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgAbout)" filter="url(#shadowAbout)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#glowAbout)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderAbout)" stroke-width="2" />

  <!-- Subtle Geometric Accent Rings -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />
  <circle cx="128" cy="128" r="92" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2,6" opacity="0.15" />

  <!-- Central Information Badge Shield -->
  <g filter="url(#shadowAbout)">
    <circle cx="128" cy="128" r="62" fill="url(#badgeGrad)" stroke="url(#badgeStroke)" stroke-width="3" />
  </g>

  <!-- Ambient Internal Core Glow -->
  <circle cx="128" cy="128" r="44" fill="#38bdf8" opacity="0.1" filter="url(#glowFilterAbout)" />

  <!-- Info Symbol "i": Dot -->
  <g filter="url(#glowFilterAbout)">
    <circle cx="128" cy="94" r="10.5" fill="url(#infoGlyphGrad)" />
    <circle cx="128" cy="94" r="4" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Info Symbol "i": Stem -->
  <g filter="url(#shadowAbout)">
    <rect x="117.5" y="116" width="21" height="48" rx="10.5" fill="url(#infoGlyphGrad)" />
    <!-- Highlight Reflection -->
    <path d="M 120 122 Q 128 118 136 122" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Satellite Accents / Data Nodes -->
  <circle cx="76" cy="80" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="180" cy="176" r="3" fill="#c084fc" opacity="0.7" />

  <!-- Top Glass Highlight -->
  <path d="M 16 64 C 16 38 38 16 64 16 L 192 16 C 218 16 240 38 240 64 C 240 78 170 116 128 116 C 62 116 16 96 16 64 Z" 
        fill="#ffffff" 
        opacity="0.04" />
</svg>