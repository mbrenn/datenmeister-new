<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glowHome" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderHome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- House Body Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Door / Portal Glow Gradient -->
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Window Light -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowHome" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilterHome" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgHome)" filter="url(#shadowHome)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#glowHome)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderHome)" stroke-width="2" />

  <!-- Background Accent Halo -->
  <circle cx="128" cy="130" r="56" fill="#6366f1" opacity="0.12" filter="url(#glowFilterHome)" />

  <!-- Isometric Ground / Foundation Plate -->
  <path d="M 64 196 L 128 214 L 192 196 L 128 178 Z" fill="#1e293b" opacity="0.6" stroke="#38bdf8" stroke-width="1.2" />

  <!-- Main House Structure -->
  <g filter="url(#shadowHome)">
    <!-- Main Walls -->
    <path d="M 72 120 L 128 72 L 184 120 L 184 190 C 184 194 180 198 176 198 L 80 198 C 76 198 72 194 72 190 Z" 
          fill="url(#wallGrad)" 
          stroke="#38bdf8" 
          stroke-width="1.5" 
          stroke-opacity="0.5" />

    <!-- Sleek Overhanging Modern Roof Gable -->
    <path d="M 54 124 L 128 60 L 202 124 L 190 138 L 128 84 L 66 138 Z" 
          fill="url(#roofGrad)" />
    
    <!-- Roof Top Edge Ridge Highlight -->
    <path d="M 64 130 L 128 74 L 192 130" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.5" 
          opacity="0.8" />

    <!-- Chimney / High-tech Sensor Port -->
    <rect x="156" y="66" width="16" height="28" rx="3" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <line x1="156" y1="72" x2="172" y2="72" stroke="#38bdf8" stroke-width="1" />

    <!-- Illuminated Portal / Doorway -->
    <path d="M 112 198 L 112 148 C 112 140 120 134 128 134 C 136 134 144 140 144 148 L 144 198 Z" 
          fill="url(#doorGrad)" />
    <circle cx="138" cy="168" r="2.5" fill="#ffffff" />

    <!-- Portal Light Glow -->
    <path d="M 116 198 L 116 150 C 116 144 122 138 128 138 C 134 138 140 144 140 150 L 140 198 Z" 
          fill="#ffffff" opacity="0.3" />

    <!-- Left Modern Data Window -->
    <rect x="84" y="142" width="18" height="24" rx="4" fill="url(#windowGrad)" />
    <line x1="93" y1="142" x2="93" y2="166" stroke="#0f172a" stroke-width="1.2" />
    <line x1="84" y1="154" x2="102" y2="154" stroke="#0f172a" stroke-width="1.2" />

    <!-- Right Modern Data Window -->
    <rect x="154" y="142" width="18" height="24" rx="4" fill="url(#windowGrad)" />
    <line x1="163" y1="142" x2="163" y2="166" stroke="#0f172a" stroke-width="1.2" />
    <line x1="154" y1="154" x2="172" y2="154" stroke="#0f172a" stroke-width="1.2" />
  </g>

  <!-- Roof Apex Sparkle / Floating Beacon -->
  <g filter="url(#glowFilterHome)">
    <circle cx="128" cy="60" r="4" fill="#ffffff" />
    <circle cx="128" cy="60" r="8" fill="#38bdf8" opacity="0.6" />
    <circle cx="80" cy="80" r="2" fill="#818cf8" opacity="0.7" />
    <circle cx="188" cy="100" r="2" fill="#c084fc" opacity="0.7" />
  </g>

  <!-- Top Glass Reflection -->
  <path d="M 16 64 C 16 38 38 16 64 16 L 192 16 C 218 16 240 38 240 64 C 240 78 170 116 128 116 C 62 116 16 96 16 64 Z" 
        fill="#ffffff" 
        opacity="0.04" />
</svg>