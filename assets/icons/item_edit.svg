<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgEdit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glowEdit" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderEdit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Document Card Gradients -->
    <linearGradient id="docCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="docBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Pen / Stylus Gradients -->
    <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="penTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowEdit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilterEdit" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgEdit)" filter="url(#shadowEdit)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#glowEdit)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderEdit)" stroke-width="2" />

  <!-- Document Card / Item Record -->
  <g filter="url(#shadowEdit)">
    <!-- Base Card -->
    <rect x="52" y="52" width="112" height="152" rx="12" fill="url(#docCardGrad)" stroke="url(#docBorderGrad)" stroke-width="1.8" />

    <!-- Card Header Tag -->
    <rect x="66" y="68" width="46" height="10" rx="5" fill="#38bdf8" opacity="0.85" />
    
    <!-- Document Field Lines -->
    <rect x="66" y="92" width="76" height="7" rx="3.5" fill="#64748b" opacity="0.6" />
    <rect x="66" y="110" width="60" height="7" rx="3.5" fill="#64748b" opacity="0.4" />
    <rect x="66" y="128" width="70" height="7" rx="3.5" fill="#64748b" opacity="0.4" />
    <rect x="66" y="146" width="48" height="7" rx="3.5" fill="#64748b" opacity="0.3" />

    <!-- Editing Highlight Box -->
    <rect x="62" y="122" width="78" height="18" rx="5" fill="#818cf8" opacity="0.15" stroke="#818cf8" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- Active Stylus / Pen (Angled Dynamic Tool) -->
  <g filter="url(#shadowEdit)">
    <!-- Pen Barrel & Cap (Rotated -45deg) -->
    <!-- Stylus Point: (126, 156), End: (198, 56) -->
    <g transform="translate(4, -4)">
      <!-- Main Pen Body -->
      <path d="M 174 48 L 196 70 L 142 144 L 120 122 Z" fill="url(#penBodyGrad)" />
      <!-- Pen Shadow Facet -->
      <path d="M 174 48 L 185 59 L 131 133 L 120 122 Z" fill="#ffffff" opacity="0.3" />
      
      <!-- Pen Nib Collar -->
      <path d="M 120 122 L 142 144 L 124 162 L 110 148 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      
      <!-- Luminous Pen Tip Nib -->
      <polygon points="110,148 124,162 104,170" fill="url(#penTipGrad)" />

      <!-- Pen Cap Finial -->
      <path d="M 174 48 L 196 70 L 204 62 L 182 40 Z" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    </g>
  </g>

  <!-- Glowing Active Editing Nib Sparkle -->
  <g filter="url(#glowFilterEdit)">
    <circle cx="108" cy="166" r="3.5" fill="#ffffff" />
    <circle cx="108" cy="166" r="7.5" fill="#f43f5e" opacity="0.7" />
    <circle cx="204" cy="46" r="2.5" fill="#c084fc" opacity="0.8" />
  </g>

  <!-- Top Glass Reflection -->
  <path d="M 16 64 C 16 38 38 16 64 16 L 192 16 C 218 16 240 38 240 64 C 240 78 170 116 128 116 C 62 116 16 96 16 64 Z" 
        fill="#ffffff" 
        opacity="0.04" />
</svg>