<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgRefresh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glowRefresh" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderRefresh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Arrow Gradients -->
    <linearGradient id="arrowGradTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="arrowGradBottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowRefresh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilterRefresh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgRefresh)" filter="url(#shadowRefresh)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#glowRefresh)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderRefresh)" stroke-width="2" />

  <!-- Background Orbit Guide -->
  <circle cx="128" cy="128" r="62" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.2" />

  <!-- Center Core Beacon -->
  <circle cx="128" cy="128" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  <circle cx="128" cy="128" r="6" fill="#38bdf8" filter="url(#glowFilterRefresh)" />

  <!-- Main Dual Refresh Arrows -->
  <g filter="url(#shadowRefresh)">
    <!-- Top Sweeping Arc with Arrowhead -->
    <!-- Arc path from (66, 128) curving up to (180, 96) with an arrowhead -->
    <path d="M 68 134 C 68 94 98 64 138 64 C 160 64 178 74 190 90" 
          fill="none" 
          stroke="url(#arrowGradTop)" 
          stroke-width="16" 
          stroke-linecap="round" />
    <!-- Top Arrow Head -->
    <polygon points="194,66 208,102 170,96" 
             fill="#c084fc" 
             stroke="#ffffff" 
             stroke-width="1" />

    <!-- Bottom Sweeping Arc with Arrowhead -->
    <!-- Arc path from (188, 122) curving down to (76, 160) with an arrowhead -->
    <path d="M 188 122 C 188 162 158 192 118 192 C 96 192 78 182 66 166" 
          fill="none" 
          stroke="url(#arrowGradBottom)" 
          stroke-width="16" 
          stroke-linecap="round" />
    <!-- Bottom Arrow Head -->
    <polygon points="62,190 48,154 86,160" 
             fill="#38bdf8" 
             stroke="#ffffff" 
             stroke-width="1" />
  </g>

  <!-- Glowing Stream Sparkles -->
  <g filter="url(#glowFilterRefresh)">
    <circle cx="128" cy="64" r="2.5" fill="#ffffff" />
    <circle cx="204" cy="98" r="3" fill="#ffffff" />
    <circle cx="128" cy="192" r="2.5" fill="#ffffff" />
    <circle cx="52" cy="158" r="3" fill="#ffffff" />
    <circle cx="70" cy="90" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="186" cy="166" r="2" fill="#c084fc" opacity="0.8" />
  </g>

  <!-- Top Glass Reflection -->
  <path d="M 16 64 C 16 38 38 16 64 16 L 192 16 C 218 16 240 38 240 64 C 240 78 170 116 128 116 C 62 116 16 96 16 64 Z" 
        fill="#ffffff" 
        opacity="0.04" />
</svg>