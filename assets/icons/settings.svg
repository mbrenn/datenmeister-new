<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgSettings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glowSettings" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderSettings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Master Gear Gradients -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="gearInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowSettings" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilterSettings" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgSettings)" filter="url(#shadowSettings)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#glowSettings)" />
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderSettings)" stroke-width="2" />

  <!-- Orbital Technical Guide Rings -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,6" opacity="0.25" />
  <circle cx="128" cy="128" r="88" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2,8" opacity="0.15" />

  <!-- Main High-Precision Cogwheel Assembly -->
  <g filter="url(#shadowSettings)">
    <!-- 8-Teeth Precision Gear Path -->
    <!-- Center (128, 128), Outer R=68, Inner R=54 -->
    <path d="
      M 120 60 L 136 60 L 139 74 C 145 76 150 79 155 83 L 168 76 L 180 88 L 173 101 C 177 106 180 111 182 117 L 196 120 L 196 136 L 182 139 C 180 145 177 150 173 155 L 180 168 L 168 180 L 155 173 C 150 177 145 180 139 182 L 136 196 L 120 196 L 117 182 C 111 180 106 177 101 173 L 88 180 L 76 168 L 83 155 C 79 150 76 145 74 139 L 60 136 L 60 120 L 74 117 C 76 111 79 106 83 101 L 76 88 L 88 76 L 101 83 C 106 79 111 76 117 74 Z
    " fill="url(#gearGrad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Gear Body Rim Chamfer -->
    <circle cx="128" cy="128" r="48" fill="url(#gearInnerGrad)" stroke="#38bdf8" stroke-width="2" />

    <!-- High-Tech Core Axis Hub -->
    <circle cx="128" cy="128" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="128" cy="128" r="16" fill="url(#gearGrad)" />
    <circle cx="128" cy="128" r="6" fill="#ffffff" />
  </g>

  <!-- Mechanical Bolt Dots on Hub Rim -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="128" cy="90" r="3" />
    <circle cx="166" cy="128" r="3" />
    <circle cx="128" cy="166" r="3" />
    <circle cx="90" cy="128" r="3" />
  </g>

  <!-- Glowing Accent Sparkles -->
  <g filter="url(#glowFilterSettings)">
    <circle cx="128" cy="128" r="3" fill="#ffffff" />
    <circle cx="180" cy="76" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="76" cy="180" r="2.5" fill="#c084fc" opacity="0.8" />
  </g>

  <!-- Top Glass Reflection -->
  <path d="M 16 64 C 16 38 38 16 64 16 L 192 16 C 218 16 240 38 240 64 C 240 78 170 116 128 116 C 62 116 16 96 16 64 Z" 
        fill="#ffffff" 
        opacity="0.04" />
</svg>