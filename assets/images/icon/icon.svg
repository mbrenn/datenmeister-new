<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Modern Luxury Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <!-- Ambient Center Light -->
    <radialGradient id="ambientGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Master Apex Cube (Electric Cyan / Azure Blue) -->
    <linearGradient id="cube1Top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cube1Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="cube1Right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Metamodel Node (Vibrant Indigo / Violet) -->
    <linearGradient id="cube2Top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cube2Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="cube2Right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Data Node (Electric Emerald / Teal) -->
    <linearGradient id="cube3Top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="cube3Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="cube3Right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#155e75" />
    </linearGradient>

    <!-- Base Extent Platform Gradients -->
    <linearGradient id="plateTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="plateStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>

    <!-- Flow Energy Gradients -->
    <linearGradient id="flowGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1" />
    </linearGradient>

    <!-- Soft Filters and Glows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Ambient Inner Light -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#ambientGlow)" />

  <!-- High-Precision Beveled Border Stroke -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Geometric Grid Accent Lines -->
  <g opacity="0.16" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3">
    <line x1="128" y1="44" x2="216" y2="95" />
    <line x1="128" y1="44" x2="40" y2="95" />
    <line x1="40" y1="95" x2="128" y2="146" />
    <line x1="216" y1="95" x2="128" y2="146" />
    <line x1="128" y1="146" x2="128" y2="214" />
  </g>

  <!-- Central Ambient Core Glow -->
  <circle cx="128" cy="130" r="58" fill="url(#cyanCoreGlow)" />

  <!-- Foundation Isometric Platform / Data Extent Base -->
  <g filter="url(#softShadow)">
    <!-- Base Plate Top Face -->
    <path d="M 128 152 L 196 191 L 128 230 L 60 191 Z" fill="url(#plateTop)" stroke="url(#plateStroke)" stroke-width="1.5" />
    <!-- Base Plate Thickness / Sides -->
    <path d="M 60 191 L 128 230 L 128 236 L 60 197 Z" fill="#090d16" opacity="0.95" />
    <path d="M 128 230 L 196 191 L 196 197 L 128 236 Z" fill="#0f172a" opacity="0.95" />
  </g>

  <!-- Data Flow Interconnections / Luminous Streams -->
  <g filter="url(#glowFilter)">
    <path d="M 128 88 L 128 138" stroke="url(#flowGrad1)" stroke-width="3" stroke-linecap="round" />
    <path d="M 84 148 L 128 122 L 172 148" stroke="url(#flowGrad1)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 84 165 L 128 190 L 172 165" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" fill="none" />
  </g>

  <!-- Level 1: Left Node (Emerald / Teal Data Extent) -->
  <g filter="url(#softShadow)">
    <path d="M 84 122 L 112 138 L 84 154 L 56 138 Z" fill="url(#cube3Top)" />
    <path d="M 56 138 L 84 154 L 84 186 L 56 170 Z" fill="url(#cube3Left)" />
    <path d="M 84 154 L 112 138 L 112 170 L 84 186 Z" fill="url(#cube3Right)" />
    <!-- Highlights -->
    <path d="M 56 138 L 84 154 L 112 138" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.8" />
    <line x1="84" y1="154" x2="84" y2="186" stroke="#67e8f9" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Level 1: Right Node (Indigo / Violet Metamodel Node) -->
  <g filter="url(#softShadow)">
    <path d="M 172 122 L 200 138 L 172 154 L 144 138 Z" fill="url(#cube2Top)" />
    <path d="M 144 138 L 172 154 L 172 186 L 144 170 Z" fill="url(#cube2Left)" />
    <path d="M 172 154 L 200 138 L 200 170 L 172 186 Z" fill="url(#cube2Right)" />
    <!-- Highlights -->
    <path d="M 144 138 L 172 154 L 200 138" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.85" />
    <line x1="172" y1="154" x2="172" y2="186" stroke="#d8b4fe" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Level 2: Master Core Node (Apex Data Cube - Electric Azure / Cyan) -->
  <g filter="url(#dropShadow)">
    <path d="M 128 48 L 164 68 L 128 88 L 92 68 Z" fill="url(#cube1Top)" />
    <path d="M 92 68 L 128 88 L 128 128 L 92 108 Z" fill="url(#cube1Left)" />
    <path d="M 128 88 L 164 68 L 164 108 L 128 128 Z" fill="url(#cube1Right)" />
    <!-- Crystal Top Edge Highlight -->
    <path d="M 92 68 L 128 88 L 164 68" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.95" />
    <line x1="128" y1="88" x2="128" y2="128" stroke="#7dd3fc" stroke-width="1.2" opacity="0.75" />
  </g>

  <!-- Floating Glowing Sparkles & Active Data Nodes -->
  <g filter="url(#glowFilter)">
    <!-- Apex Sparkle -->
    <circle cx="128" cy="88" r="3.5" fill="#ffffff" />
    <circle cx="128" cy="88" r="7.5" fill="#38bdf8" opacity="0.6" />

    <!-- Left Sparkle -->
    <circle cx="84" cy="154" r="2.5" fill="#ffffff" />
    <circle cx="84" cy="154" r="5.5" fill="#2dd4bf" opacity="0.6" />

    <!-- Right Sparkle -->
    <circle cx="172" cy="154" r="2.5" fill="#ffffff" />
    <circle cx="172" cy="154" r="5.5" fill="#c084fc" opacity="0.6" />

    <!-- Satellite Nodes -->
    <circle cx="68" cy="94" r="2" fill="#38bdf8" opacity="0.8" />
    <circle cx="188" cy="94" r="2" fill="#c084fc" opacity="0.8" />
    <circle cx="128" cy="180" r="2.5" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Subtle Top Gloss Reflection -->
  <path d="M 16 64 C 16 38 38 16 64 16 L 192 16 C 218 16 240 38 240 64 C 240 78 170 116 128 116 C 62 116 16 96 16 64 Z" 
        fill="#ffffff" 
        opacity="0.04" />
</svg>
